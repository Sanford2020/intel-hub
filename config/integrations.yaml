# External integrations — synced via scripts/sync-integrations.ps1

twelve_factor_agents:
  repo: https://github.com/humanlayer/12-factor-agents
  license: Apache-2.0
  role: engineering_principles
  local_docs: docs/standards/12-factor-agents.md
  local_runtime: services/agent/

opc_methodology:
  repo: https://github.com/easychen/opc-methodology
  license: CC-BY-NC-SA-4.0
