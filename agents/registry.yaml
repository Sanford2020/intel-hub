# Unified Agent Registry — three pillars

layers:
  business:
    source: opc-methodology
    path: skills/opc/
    docs: docs/standards/opc-methodology.md
  personas:
    source: agency-agents
    path: agents/agency/
    docs: docs/standards/agency-agents.md
  engineering:
    source: 12-factor-agents
    path: services/agent/
    docs: docs/standards/12-factor-agents.md

# Core engineering team (always present)
core_agents:
  - id: product_manager
    path: agents/roles/product_manager.md
    layer: core
  - id: architect
    path: agents/roles/architect.md
    layer: core
  - id: backend_engineer
    path: agents/roles/backend_engineer.md
    layer: core
  - id: frontend_engineer
    path: agents/roles/frontend_engineer.md
    layer: core
  - id: ai_engineer
    path: agents/roles/ai_engineer.md
    layer: core
  - id: devops_engineer
    path: agents/roles/devops_engineer.md
    layer: core
  - id: qa_engineer
    path: agents/roles/qa_engineer.md
    layer: core
  - id: security_engineer
    path: agents/roles/security_engineer.md
    layer: core

