agency_agents:
  repo: https://github.com/msitarzewski/agency-agents
  license: MIT
  role: agent_personas
  local_docs: docs/standards/agency-agents.md
  sync_target: agents/agency/
  divisions:
    - engineering
    - design
    - product
    - marketing
    - project-management
    - testing
    - strategy
